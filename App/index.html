<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YOLO Object Detection & Grabbing</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary-bg: #0f0f0f;
            --text-color: #ffffff;
            --panel-bg: rgba(255, 255, 255, 0.08);
            --blob1: #4facfe;
            --blob2: #00f2fe;
            --accent-color: #ffd369;
        }

        body.light {
            --primary-bg: #f5f5fa;
            --text-color: #2c2c2c;
            --panel-bg: rgba(0, 0, 0, 0.05);
            --blob1: #fbc2eb;
            --blob2: #a6c1ee;
            --accent-color: #6a5acd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: all 0.5s ease;
            padding: 20px;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: 0;
            animation: float 30s infinite ease-in-out alternate;
            opacity: 0.25;
        }

        body::before { background: var(--blob1); top: -200px; left: -200px; }
        body::after { background: var(--blob2); bottom: -200px; right: -200px; }

        @keyframes float {
            0% { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(100px) translateX(100px); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: block;
            z-index: 1;
            position: relative;
        }

        .main-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--blob1), var(--blob2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            background: linear-gradient(to right, #667eea, #764ba2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .btn:disabled {
            background: #888;
            cursor: not-allowed;
            transform: none;
        }

        .btn-object {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            margin: 5px;
            border-radius: 12px;
            user-select: none;
        }

        .btn-object.active {
            background: linear-gradient(to right, var(--accent-color), #ffb347);
            box-shadow: 0 0 20px rgba(255, 211, 105, 0.5);
        }

        .toggle {
            background: none;
            color: var(--text-color);
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid currentColor;
            border-radius: 10px;
            padding: 8px 16px;
        }

        .object-selector { 
            text-align: center; 
            margin-bottom: 20px; 
        }

        .object-selector h3 { 
            margin-bottom: 15px; 
            color: var(--accent-color); 
        }

        /* Main content layout */
        .main-content {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .video-section {
            flex: 2;
            min-width: 0;
        }

        .stats-section {
            flex: 1;
            min-width: 300px;
        }

        .video-container { 
            text-align: center; 
        }

        #videoStream {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            background: #000;
            display: none;
        }


        #videoStream.active {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .stat-card {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .stat-title { 
            font-size: 12px; 
            opacity: 0.8; 
            margin-bottom: 5px; 
            text-transform: uppercase; 
        }

        .stat-value { 
            font-size: 18px; 
            font-weight: bold; 
            color: var(--accent-color); 
        }

        .config-section { 
            margin-top: 20px; 
            padding: 20px; 
            background: var(--panel-bg); 
            border-radius: 15px; 
            backdrop-filter: blur(10px);
        }

        .config-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 15px; 
        }

        .config-item label { 
            font-weight: 500; 
        }

        .config-item input { 
            padding: 8px 12px; 
            border: none; 
            border-radius: 8px; 
            background: rgba(255, 255, 255, 0.2); 
            color: var(--text-color); 
            width: 80px; 
        }

        .status { 
            text-align: center; 
            padding: 15px; 
            margin: 20px 0; 
            border-radius: 10px; 
            font-weight: bold; 
        }

        .status.success { 
            background: rgba(76, 175, 80, 0.3); 
            border: 2px solid #4CAF50; 
        }

        .status.error { 
            background: rgba(244, 67, 54, 0.3); 
            border: 2px solid #f44336; 
        }

        .qr-code-mobile {
            margin-top: 30px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 16px;
            display: none;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .qr-code-mobile p {
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        footer {
            text-align: center;
            color: #ccc;
            margin: 30px 0;
            font-size: 0.9rem;
        }

        /* Responsive design */
        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
            }
            
            .stats-section {
                min-width: auto;
            }
            
            .stats {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .controls { flex-direction: column; }
            .main-panel { padding: 20px; }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-panel">
            <h1>🎯 YOLO Object Detection & Grabbing</h1>
            
            <div class="controls">
                <button class="btn" id="startBtn">▶️ Start Detection</button>
                <button class="btn" id="stopBtn" disabled>⏹️ Stop Detection</button>
                <button class="toggle" onclick="toggleTheme()">🌙 Toggle Theme</button>
            </div>
            
            <div class="object-selector">
                <h3>🎯 Select Target Object</h3>
                <button class="btn btn-object" id="paperballBtn" onclick="selectObject('paper ball')">📄 Paper Ball</button>
                <button class="btn btn-object" id="cupBtn" onclick="selectObject('cup')">☕ Cup</button>
                <button class="btn btn-object" id="eraserBtn" onclick="selectObject('eraser')">🧽 Eraser</button>
            </div>
            
            <div id="status" class="status" style="display: none;"></div>
            
            <div class="main-content">
                <div class="video-section">
                    <div class="video-container">
                        <img id="videoStream" src="" alt="Video stream will appear here" />
                    </div>
                </div>
                
                <div class="stats-section">
                    <div class="stats">
                        <div class="stat-card"><div class="stat-title">Status</div><div class="stat-value" id="statusValue">Inactive</div></div>
                        <div class="stat-card"><div class="stat-title">Target</div><div class="stat-value" id="targetValue">None</div></div>
                        <div class="stat-card"><div class="stat-title">Distance</div><div class="stat-value" id="distanceValue">N/A</div></div>
                        <div class="stat-card"><div class="stat-title">Frames</div><div class="stat-value" id="framesValue">0</div></div>
                        <div class="stat-card"><div class="stat-title">Processing</div><div class="stat-value" id="timeValue">0.000s</div></div>
                        <div class="stat-card"><div class="stat-title">Grab State</div><div class="stat-value" id="grabValue">Idle</div></div>
                    </div>
                </div>
            </div>
            
            <div class="config-section">
                <h3>⚙️ Configuration</h3>
                <div class="config-item">
                    <label for="confidenceSlider">Confidence Threshold:</label>
                    <div>
                        <input type="range" id="confidenceSlider" min="0.1" max="1.0" step="0.05" value="0.65" />
                        <span id="confidenceValue">0.65</span>
                    </div>
                </div>
            </div>
            
            <div id="qrSection" class="qr-code-mobile">
                <p>Scan to access on mobile:</p>
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2025 YOLOv8 Interface — Flask, OpenCV, Ultralytics
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const videoStream = document.getElementById('videoStream');
        const statusDiv = document.getElementById('status');
        const confidenceSlider = document.getElementById('confidenceSlider');
        const confidenceValue = document.getElementById('confidenceValue');

        let statsInterval;
        let selectedObject = null;

        function showStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            setTimeout(() => { statusDiv.style.display = 'none'; }, 4000);
        }

        function updateStats() {
            fetch('/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('statusValue').textContent = data.active ? 'Active' : 'Inactive';
                    document.getElementById('targetValue').textContent = data.targetValue;
                    document.getElementById('distanceValue').textContent = data.distanceValue;
                    document.getElementById('framesValue').textContent = data.framesValue;
                    document.getElementById('timeValue').textContent = data.timeValue;
                    document.getElementById('grabValue').textContent = data.grabValue;
                })
                .catch(error => console.error('Stats error:', error));
        }

        function selectObject(objectName) {
            if (!startBtn.disabled) {
                showStatus('Please start the detection system first!', 'error');
                return;
            }

            document.querySelectorAll('.btn-object').forEach(btn => btn.classList.remove('active'));
            const btnId = objectName.replace(' ', '') + 'Btn';
            document.getElementById(btnId).classList.add('active');
            selectedObject = objectName;

            fetch('/grab', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({object: objectName})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showStatus(data.message, 'success');
                } else {
                    showStatus(data.message, 'error');
                }
            })
            .catch(error => {
                showStatus('Network error sending command.', 'error');
                console.error('Error:', error);
            });
        }

        startBtn.addEventListener('click', () => {
            fetch('/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'start'})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    videoStream.src = '/video_feed';
                    videoStream.classList.add('active');
                    showStatus(data.message, 'success');
                    statsInterval = setInterval(updateStats, 1000);
                } else {
                    showStatus(data.message, 'error');
                }
            });
        });

        stopBtn.addEventListener('click', () => {
            fetch('/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'stop'})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    videoStream.classList.remove('active');
                    videoStream.src = '';
                    showStatus(data.message, 'success');
                    if (statsInterval) clearInterval(statsInterval);
                    // Reset UI on stop
                    document.getElementById('statusValue').textContent = 'Inactive';
                    document.getElementById('grabValue').textContent = 'Idle';
                    document.querySelectorAll('.btn-object').forEach(btn => btn.classList.remove('active'));
                } else {
                    showStatus(data.message, 'error');
                }
            });
        });

        confidenceSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            confidenceValue.textContent = value.toFixed(2);
            fetch('/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({confidence_threshold: value})
            });
        });

        function toggleTheme() {
            const body = document.body;
            const light = body.classList.toggle('light');
            window.currentTheme = light ? 'light' : 'dark';
        }

        window.onload = () => {
            if (window.currentTheme === 'light') {
                document.body.classList.add('light');
            }

            const qrContainer = document.getElementById("qrcode");
            const qrSection = document.getElementById("qrSection");

            // Generate QR code with actual IP address for mobile access
            const getAccessibleURL = () => {
                const currentUrl = window.location.href;
                if (currentUrl.includes('localhost') || currentUrl.includes('127.0.0.1')) {
                    // Replace localhost with actual IP for mobile access
                    const port = window.location.port || '5000';
                    return `http://192.168.137.1:${port}`;
                }
                return currentUrl;
            };

            new QRCode(qrContainer, {
                text: getAccessibleURL(),
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            qrSection.style.display = 'block';
            
            // Initial stats update on page load
            updateStats();
        };
    </script>
</body>
</html>
